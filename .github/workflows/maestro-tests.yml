name: Maestro iOS Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ios-cloud-tests:
    name: Run iOS Tests on Maestro Cloud
    runs-on: ubuntu-latest # Cloud tests don't need macOS runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Debug - Check if secrets exist
        run: |
          if [ -z "${{ secrets.MAESTRO_CLOUD_API_KEY }}" ]; then
            echo "❌ MAESTRO_CLOUD_API_KEY is empty or not set"
          else
            echo "✅ MAESTRO_CLOUD_API_KEY is set (length: ${#MAESTRO_CLOUD_API_KEY})"
          fi
          if [ -z "${{ secrets.MAESTRO_CLOUD_PROJECT_ID }}" ]; then
            echo "❌ MAESTRO_CLOUD_PROJECT_ID is empty or not set"
          else
            echo "✅ MAESTRO_CLOUD_PROJECT_ID is set (length: ${#MAESTRO_CLOUD_PROJECT_ID})"
          fi
        env:
          MAESTRO_CLOUD_API_KEY: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          MAESTRO_CLOUD_PROJECT_ID: ${{ secrets.MAESTRO_CLOUD_PROJECT_ID }}

      - name: Run Maestro Cloud Tests for iOS
        uses: mobile-dev-inc/action-maestro-cloud@v1
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          project-id: ${{ secrets.MAESTRO_CLOUD_PROJECT_ID }}
          app-file: Wikipedia.app
          workspace: .maestro/ios
          device-os: iOS-17-5
          # Optional parameters:
          # device-locale: en_US
          # name: Wikipedia iOS Tests
          # async: false
          # env: |
          #   USERNAME=test_user
          #   PASSWORD=test_pass

      # The Maestro Cloud action automatically:
      # - Uploads your app
      # - Runs tests on real iOS devices in the cloud
      # - Captures screenshots and videos
      # - Generates test reports
      # - Returns results with pass/fail status

      # Results are viewable at: https://console.mobile.dev

